name: Auto Convert Excel to JSON

on:
  push:
    branches:
      - main 
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }} 

      - name: 파이썬 환경 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요한 패키지 설치
        run: pip install pandas openpyxl

      - name: 파이썬 스크립트 실행
        run: python convert.py

      - name: 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          git commit -m "Auto-update: market_data.json generated from Excel" || echo "No changes to commit"
          git push
