name: Auto Convert Excel to JSON

on:
  push:
    paths:
      - 'FY27 Market Definition.xlsx' # 이 엑셀 파일이 덮어씌워질 때만 트리거 작동

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 봇이 깃허브에 커밋할 수 있는 권한 부여

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요한 파이썬 패키지 설치
        run: pip install pandas openpyxl

      - name: 파이썬 스크립트 실행 (JSON 생성)
        run: python convert.py

      - name: 새로 생성된 JSON 파일을 저장소에 자동 커밋 및 푸시
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: market_data.json generated from Excel"
          file_pattern: market_data.json
